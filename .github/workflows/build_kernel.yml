name: Build Lolz Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git wget python3 zip

      - name: Setup Clang Toolchain
        run: |
          mkdir -p /opt/clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b /opt/clang

      - name: Setup AnyKernel3
        run: |
          git clone https://github.com/Kernel-SU/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git anykernel/README.md

      - name: Build Kernel
        run: |
          export PATH="/opt/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- pine_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package Kernel (AnyKernel3)
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          else
            cp out/arch/arm64/boot/Image anykernel/
          fi
          cd anykernel
          zip -r9 ../kernel-lolz-v31-pine.zip *

      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Lolz-Kernel-v31-Redmi
          path: kernel-lolz-v31-pine.zip
