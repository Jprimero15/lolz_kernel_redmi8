name: Compilar LolzKernel Clang (pine)

on:
  push:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Compilación con Clang (KSU + F2FS)
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libelf-dev \
            git \
            zip \
            unzip \
            curl \
            python3 \
            cpio \
            lld \
            llvm

      - name: Descargar Toolchains desde GitHub
        run: |
          mkdir -p toolchain
          # Clonar Clang desde un repositorio espejo oficial en GitHub
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r383902.git toolchain/clang
          # Clonar cross-compilers de AOSP para arquitectura arm64 y arm32
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain/aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain/arm32

      - name: Configurar Rutas del Toolchain
        run: |
          echo "$PWD/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$PWD/toolchain/aarch64/bin" >> $GITHUB_PATH
          echo "$PWD/toolchain/arm32/bin" >> $GITHUB_PATH

      - name: Compilar Kernel con Clang (KSU y F2FS Intactos)
        run: |
          mkdir -p out
          
          CONFIG_PATH=$(find arch/arm64/configs -name "*pine*" -o -name "*mi439*" -o -name "*sdm439*" | head -n 1)
          if [ -z "$CONFIG_PATH" ]; then
            CONFIG_PATH=$(find arch/arm64/configs -name "*defconfig" | head -n 1)
          fi
          
          CONFIG_NAME=$(basename "$CONFIG_PATH")
          echo "Defconfig detectado: $CONFIG_NAME en $CONFIG_PATH"
          
          if [ "$CONFIG_PATH" != "arch/arm64/configs/$CONFIG_NAME" ]; then
            cp "$CONFIG_PATH" arch/arm64/configs/
          fi
          
          # Configurar con Clang
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            "$CONFIG_NAME"
          
          # Compilar en paralelo usando Clang
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KCFLAGS="-w"

      - name: Empaquetar con AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          IMAGE=$(find out/arch/arm64/boot/ -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No se encontró la imagen del kernel en out/"
            exit 1
          fi
          cp "$IMAGE" AnyKernel3/
          DTBO=$(find out/arch/arm64/boot/ -name "dtbo.img" | head -n 1)
          if [ -n "$DTBO" ] && [ -f "$DTBO" ]; then
            cp "$DTBO" AnyKernel3/
          fi
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=pine/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=redmi7a/' anykernel.sh
          sed -i 's/block=.*/block=auto;/' anykernel.sh
          zip -r9 ../LolzKernel-Clang-Final.zip * -x .git README.md *placeholder

      - name: Subir ZIP Resultante
        uses: actions/upload-artifact@v4
        with:
          name: LolzKernel-Clang-Final
          path: LolzKernel-Clang-Final.zip
